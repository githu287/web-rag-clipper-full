# Alembic configuration (Phase 2.9 Step 1)
#
# Design notes:
# - sqlalchemy.url is intentionally empty; alembic/env.py injects MySQL URL
#   built from core.config.Settings at runtime.
# - ALEMBIC_DATABASE_URL env var can override the URL (used for SQLite testing).
# - script_location = alembic points to the project-root alembic/ directory.

[alembic]
# Migration scripts directory
script_location = alembic
# Prepend project root to sys.path so env.py can import backend.*
prepend_sys_path = .
version_path_separator = os
# Empty: env.py injects URL from Settings (or ALEMBIC_DATABASE_URL override)
sqlalchemy.url =

# Logging (alembic default template)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

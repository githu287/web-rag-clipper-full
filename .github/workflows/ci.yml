name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  backend:
    name: Backend and datasets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            backend/requirements-ocr.txt
            backend/requirements-video.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt -r backend/requirements-ocr.txt -r backend/requirements-video.txt
      - name: Run backend regression tests and validate public datasets
        run: python scripts/check.py backend datasets
      - name: Verify real local OCR models including long-image seams
        run: python scripts/check_ocr.py

  extension:
    name: Extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check extension JavaScript and run every Node regression suite
        run: python scripts/check.py extension

  capture-browser:
    name: Extension capture (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install isolated browser test dependency
        run: python -m pip install playwright==1.64.1 -r requirements-dev.txt -r backend/requirements-ocr.txt -r backend/requirements-video.txt
      - name: Install Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Exercise real unpacked extension on local fixtures
        run: python scripts/check_capture_browser.py --channel chromium
      - name: Exercise bounded scrolling and virtual-list capture
        run: python scripts/check_scroll_capture_browser.py --channel chromium
      - name: Exercise real extension and local OCR preview without database writes
        run: python scripts/check_ocr_browser.py --channel chromium
      - name: Exercise bounded article pagination and temporary-tab cleanup
        run: python scripts/check_pagination_browser.py --channel chromium
      - name: Exercise video transcripts, source seeking, optional persistence and isolation
        run: python scripts/check_video_browser.py --channel chromium

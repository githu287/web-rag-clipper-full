<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Extractor browser regression tests</title>
  <style>
    .inactive-panel { display: none; }
  </style>
</head>
<body>
  <script src="../vendor/readability/Readability.js"></script>
  <script src="../extractor.js"></script>
  <script>
    "use strict";

    const failures = [];
    function assert(condition, message) {
      if (!condition) failures.push(message);
    }
    function fill(text, count) {
      return Array(count).fill(text).join(" ");
    }

    document.body.innerHTML = `
      <main class="vp-doc">
        <h1>Vue 单文件组件</h1>
        <div class="inactive-panel">
          <h2>选项式 API（未激活）</h2>
          <p>${fill("这段内容属于 CSS 隐藏的未激活标签页，不应进入剪藏结果。", 12)}</p>
        </div>
        <article>
          <h2>组合式 API</h2>
          <p>${fill("可见正文介绍模板、逻辑与样式如何封装在同一个 Vue 文件中。", 12)}</p>
        </article>
      </main>`;
    const hiddenResult = webRagPageExtractor.extract(document);
    assert(hiddenResult.text.includes("组合式 API"), "应保留当前可见的标签页内容");
    assert(!hiddenResult.text.includes("选项式 API（未激活）"), "不应提取 CSS 隐藏的标签页内容");
    assert(hiddenResult.diagnostics.hidden_removed_node_count >= 1, "应记录被移除的隐藏节点");

    document.body.innerHTML = `
      <div class="page-shell">
        <h1>完整文章标题</h1>
        <p>这是位于正文候选节点外部、但属于文章的摘要说明文字。</p>
        <div class="article-body">
          <h2>正文第一节</h2>
          <p>${fill("正文段落用于验证候选父容器扩展能够补回标题和摘要。", 15)}</p>
        </div>
      </div>`;
    const expandedResult = webRagPageExtractor.extract(document);
    assert(expandedResult.text.includes("完整文章标题"), "父容器扩展应补回文章标题");
    assert(expandedResult.text.includes("摘要说明文字"), "父容器扩展应补回文章摘要");
    assert(expandedResult.diagnostics.expanded_from === "div.article-body", "诊断应记录扩展前的正文节点");

    document.body.innerHTML = `
      <article>
        <h1>带附注的文章</h1>
        <p>${fill("文章正文包含足够的信息用于选择语义化 article 节点。", 14)}</p>
        <aside><p>作者附注：这里是正文相关的补充说明。</p></aside>
        <footer class="references"><p>参考资料：规范章节 A 与规范章节 B。</p></footer>
        <aside class="related-posts">无关推荐：另一篇文章</aside>
      </article>`;
    const semanticResult = webRagPageExtractor.extract(document);
    assert(semanticResult.text.includes("作者附注"), "应保留文章内部的有效附注");
    assert(semanticResult.text.includes("参考资料"), "应保留文章内部的参考资料");
    assert(!semanticResult.text.includes("无关推荐"), "应移除明确标记的相关推荐");

    document.body.innerHTML = `
      <article>
        <h1>正文链接测试</h1>
        <p>${fill("正文段落用于保证文章节点达到正文候选的最低长度要求。", 12)}</p>
        <p>请阅读 <a href="https://cn.vuejs.org/api/sfc-spec.html">单文件组件语法说明</a>，
          或打开 <a href="https://play.vuejs.org/">Vue 演练场</a>。</p>
        <p><a href="javascript:alert('unsafe')">不安全链接</a>仍应保留文字。</p>
      </article>`;
    const linkResult = webRagPageExtractor.extract(document);
    assert(
      linkResult.text.includes("[单文件组件语法说明](<https://cn.vuejs.org/api/sfc-spec.html>)"),
      "应把正文链接序列化为带绝对地址的 Markdown 链接",
    );
    assert(linkResult.text.includes("不安全链接"), "无效链接仍应保留可读文字");
    assert(!linkResult.text.includes("javascript:"), "不应输出 javascript 链接");
    assert(linkResult.diagnostics.link_count === 3, "应统计正文中的链接数量");
    assert(linkResult.diagnostics.preserved_link_count === 2, "应统计成功保留的安全链接数量");

    document.body.innerHTML = `
      <article>
        <h1>行内语义测试</h1>
        <p>${fill("正文段落用于保证文章节点达到正文候选的最低长度要求。", 12)}</p>
        <p><strong>单文件组件</strong>使用 <code>*.vue</code> 扩展名，包含
          <code>&lt;template&gt;</code>、<em>逻辑</em>和 <del>旧写法</del>。</p>
      </article>`;
    const inlineResult = webRagPageExtractor.extract(document);
    assert(inlineResult.text.includes("**单文件组件**"), "应保留粗体语义");
    assert(inlineResult.text.includes("`*.vue`"), "应保留行内代码语义");
    assert(inlineResult.text.includes("`<template>`"), "行内 HTML 标签应作为代码保留");
    assert(inlineResult.text.includes("*逻辑*"), "应保留斜体语义");
    assert(inlineResult.text.includes("~~旧写法~~"), "应保留删除线语义");
    assert(inlineResult.diagnostics.inline_code_count === 2, "应统计行内代码数量");
    assert(inlineResult.diagnostics.emphasis_count === 3, "应统计强调节点数量");

    document.body.innerHTML = `
      <article id="complex-article">
        <h1><code>&lt;table&gt;</code> 结构测试</h1>
        <p>${fill("正文段落用于保证文章节点达到正文候选的最低长度要求。", 12)}</p>
        <ul>
          <li>父项目
            <ul><li>子项目</li></ul>
          </li>
        </ul>
        <table>
          <thead><tr><th>名称</th><th>说明</th></tr></thead>
          <tbody><tr><td><code>table</code></td><td><a href="https://example.com/table">表格元素</a></td></tr></tbody>
        </table>
        <p>*</p>
      </article>`;
    const complexArticle = document.getElementById("complex-article");
    const codeExample = document.createElement("mdn-code-example");
    codeExample.hidden = true;
    codeExample.className = "brush: html interactive-example notranslate";
    codeExample.attachShadow({ mode: "open" }).innerHTML =
      `<div class="example-header">html 运行</div><pre class="brush: html"><code>&lt;table&gt;\n  &lt;tr&gt;&lt;td&gt;示例&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;</code></pre>`;
    complexArticle.appendChild(codeExample);
    const compatibility = document.createElement("browser-compatibility-table");
    compatibility.attachShadow({ mode: "open" }).innerHTML =
      `<table><tr><th>Chrome</th><th>Firefox</th></tr><tr><td><button aria-label="完全支持"></button></td><td>52</td></tr></table>`;
    complexArticle.appendChild(compatibility);
    const complexResult = webRagPageExtractor.extract(document);
    assert(complexResult.text.includes("# `<table>` 结构测试"), "标题内应保留行内代码");
    assert(complexResult.text.includes("  - 子项目"), "应保留嵌套列表层级");
    assert(complexResult.text.includes("| 名称 | 说明 |\n| --- | --- |"), "应输出标准 Markdown 表格");
    assert(complexResult.text.includes("| `table` | [表格元素](<https://example.com/table>) |"), "表格单元格应保留行内格式和链接");
    assert(complexResult.text.includes("```html\n<table>"), "应读取隐藏 MDN 代码组件的开放 Shadow DOM");
    assert(!complexResult.text.includes("html 运行"), "不应包含代码组件的操作栏");
    assert(complexResult.text.includes("| Chrome | Firefox |"), "应读取普通组件的开放 Shadow DOM 表格");
    assert(complexResult.text.includes("| 完全支持 | 52 |"), "表格按钮应保留无障碍状态文字");
    assert(!complexResult.text.split("\n").some(function (line) { return line.trim() === "*"; }), "应移除孤立装饰星号");
    assert(complexResult.diagnostics.shadow_root_count === 2, "应统计读取的开放 Shadow DOM 数量");

    document.body.innerHTML = `<nav>页面导航应在整页模式保留</nav><article><p>${fill("原有正文段落。", 40)}</p></article><p style="display:none">隐藏标记</p><textarea>私密输入内容</textarea>`;
    const wholePage = webRagPageExtractor.extract(document, { mode: "page" });
    assert(wholePage.text.includes("页面导航应在整页模式保留"), "整页模式不能仍按正文规则删除导航");
    assert(!wholePage.text.includes("隐藏标记"), "整页模式不应输出隐藏内容");
    assert(!wholePage.text.includes("私密输入内容"), "任何模式都不应读取输入框值");

    document.body.innerHTML = `<article><slot-example><p slot="content">插槽正文唯一标记</p><p>未分配内容标记</p></slot-example></article>`;
    document.querySelector("slot-example").attachShadow({ mode: "open" }).innerHTML = `<slot name="content">不应出现的插槽占位文字</slot>`;
    const slots = webRagPageExtractor.extract(document);
    assert(slots.text.split("插槽正文唯一标记").length === 2, "插槽文字应只输出一次");
    assert(!slots.text.includes("未分配内容标记") && !slots.text.includes("插槽占位文字"), "不应输出未渲染的组件内容");

    document.body.innerHTML = `<form id="aspnetForm"><input type="hidden" value="不应进入正文"><div id="unknown-layout"><h1>未知结构的文章</h1>${Array(8).fill(`<p>${fill("这是一篇结构不标准的文章，包含完整的叙述和标点。", 15)}</p>`).join("")}</div></form>`;
    const unknown = webRagPageExtractor.extract(document);
    assert(unknown.diagnostics.strategy === "readability", "无正文候选时应尝试 Readability");
    assert(unknown.text.includes("未知结构的文章"), "Readability 应保留有效文章内容");
    assert(document.querySelector("#unknown-layout"), "提取不得破坏原始页面 DOM");
    assert(!unknown.text.includes("不应进入正文"), "form 包裹的文章应保留正文而排除控件值");

    document.body.innerHTML = `<p id="selected">前缀 <strong>只要选中内容</strong> 后缀</p><p>不应混入的正文</p>`;
    const range = document.createRange(); range.selectNodeContents(document.querySelector("strong"));
    const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
    const selected = webRagPageExtractor.extract(document, { mode: "selection" });
    assert(selected.text.includes("只要选中内容") && !selected.text.includes("前缀") && !selected.text.includes("后缀"), "选区模式不得混入选区外内容");
    selection.removeAllRanges();

    const selectedText = document.getElementById("selected").firstChild;
    range.setStart(selectedText, 1); range.setEnd(selectedText, 2); selection.addRange(range);
    assert(webRagPageExtractor.extract(document, { mode: "selection" }).text === selectedText.nodeValue.slice(1, 2), "文本节点的部分选区必须按字符偏移截断");
    selection.removeAllRanges();
    const region = webRagPageExtractor.extract(document, { mode: "region", root: document.getElementById("selected") });
    assert(region.text.includes("前缀") && !region.text.includes("不应混入"), "区域模式仅应输出指定节点");

    document.body.innerHTML = `<article><p>可见选区文字</p><p class="inactive-panel">CSS隐藏文字不得混入选区</p><textarea>选区输入框内容</textarea></article>`;
    range.selectNodeContents(document.querySelector("article")); selection.addRange(range);
    const selectedAll = webRagPageExtractor.extract(document, { mode: "selection" });
    assert(selectedAll.text.includes("可见选区文字") && !selectedAll.text.includes("CSS隐藏") && !selectedAll.text.includes("选区输入框"), "全选也应使用原始 CSS 可见性并排除输入框");
    selection.removeAllRanges();

    document.body.innerHTML = `<table><tr><th>标题A</th><th>标题B</th></tr><tr><td>内容A</td><td>内容B</td></tr></table>`;
    const tableRegion = webRagPageExtractor.extract(document, { mode: "region", root: document.querySelector("table") });
    assert(tableRegion.text.includes("| 标题A | 标题B |\n| --- | --- |"), "指定整张表格时仍须保留表格结构");

    document.body.innerHTML = `<article><h1>图片折叠块</h1><p>${fill("已有正文。", 50)}</p><details><summary>图片摘要</summary><img alt="折叠图片说明"></details><details><summary>空折叠块</summary><p hidden>隐藏正文</p></details></article>`;
    const imageDetails = webRagPageExtractor.extract(document);
    assert(imageDetails.text.includes("图片摘要\n\n[图片：折叠图片说明]"), "仅图片的折叠正文仍须保留摘要分隔");
    assert(imageDetails.diagnostics.included_collapsed_count === 1, "仅图片折叠块应计数，清理后为空的折叠块不计数");
    assert(imageDetails.diagnostics.quality_warnings.includes("collapsed_content_included"), "图片折叠块应提示核对");

    document.body.innerHTML = `<pre id="test-result">${failures.length === 0
      ? "EXTRACTOR_BROWSER_TESTS_PASSED"
      : "EXTRACTOR_BROWSER_TESTS_FAILED\n" + failures.join("\n")}</pre>`;
  </script>
</body>
</html>

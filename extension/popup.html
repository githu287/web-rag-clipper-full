<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Web RAG Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="header">
    <span class="logo">R</span>
    <h1>Web RAG Clipper</h1>
  </div>

  <div class="view" id="view-not-logged-in" hidden>
    <div class="hint-box">请打开 Web RAG Clipper 侧边栏创建插件后使用。</div>
    <button type="button" class="primary-btn" id="open-panel-btn">打开 Side Panel</button>
  </div>

  <div class="view" id="view-logged-in" hidden>
    <div class="warn-banner" id="warn-banner" hidden>
      <span class="warn-text">⚠ 尚未配置阿里云百炼 API Key</span>
      <button type="button" class="warn-btn" id="warn-open-panel">去设置</button>
    </div>

    <div class="content">
      <div class="page-title" id="page-title">—</div>
      <div class="page-url" id="page-url">—</div>
      <div class="meta-row">
        <span class="meta-label">正文提取</span>
        <span class="meta-value" id="text-length">—</span>
      </div>
      <button type="button" class="primary-btn clip-btn" id="clip-btn">剪藏当前网页</button>
      <button type="button" class="secondary-btn" id="open-panel-btn-2">打开 Side Panel 继续对话</button>
    </div>

    <div class="state" id="status">
      <div class="state-title" id="status-title">准备中...</div>
      <div class="state-detail" id="status-detail"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="session-store.js"></script>
  <script src="api-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
